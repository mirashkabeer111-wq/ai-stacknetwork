
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StackNetwork AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080d1b;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    padding: 20px;
    background: #101a30;
    border-bottom: 1px solid #243c66;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h2 {
    color: #55aaff;
}

#clear {
    background: #1c2d4b;
    color: white;
    border: 1px solid #34527d;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.message {
    max-width: 80%;
    padding: 13px 16px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #1559a5;
    align-self: flex-end;
}

.ai {
    background: #17243b;
    border: 1px solid #2b4165;
    align-self: flex-start;
}

.welcome {
    margin: auto;
    text-align: center;
    color: #a9c9f5;
}

.welcome h1 {
    color: #55aaff;
    margin-bottom: 12px;
}

footer {
    padding: 16px;
    background: #101a30;
    border-top: 1px solid #243c66;
}

.input-area {
    max-width: 850px;
    margin: auto;
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #34527d;
    background: #080d1b;
    color: white;
    outline: none;
    min-width: 0;
}

#send {
    padding: 0 22px;
    border: none;
    border-radius: 10px;
    background: #1685ff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#send:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#status {
    text-align: center;
    color: #8da8cc;
    font-size: 12px;
    margin-top: 10px;
}

@media(max-width: 500px) {
    .message { max-width: 92%; }
    header { padding: 14px; }
}
</style>
</head>

<body>

<header>
    <h2>⚡ StackNetwork AI</h2>
    <button id="clear">New Chat</button>
</header>

<main id="chat">
    <div class="welcome" id="welcome">
        <h1>Welcome to StackNetwork AI</h1>
        <p>Ask anything. Let's get started!</p>
    </div>
</main>

<footer>
    <div class="input-area">
        <input id="prompt" type="text"
        placeholder="Message StackNetwork AI..."
        autocomplete="off">
        <button id="send">Send</button>
    </div>
    <p id="status">AI Assistant</p>
</footer>

<script>
const chat = document.getElementById("chat");
const promptInput = document.getElementById("prompt");
const sendButton = document.getElementById("send");
const statusText = document.getElementById("status");

let messages = [];

function addMessage(text, type) {
    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

async function sendMessage() {
    const text = promptInput.value.trim();
    if (!text || sendButton.disabled) return;

    promptInput.value = "";
    addMessage(text, "user");

    messages.push({
        role: "user",
        content: text
    });

    sendButton.disabled = true;
    statusText.textContent = "AI is thinking...";

    const reply = addMessage("Thinking...", "ai");

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                messages: messages
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Something went wrong");
        }

        const answer = data.reply || "No response received.";
        reply.textContent = answer;

        messages.push({
            role: "assistant",
            content: answer
        });

    } catch (error) {
        reply.textContent = "Error: " + error.message;
        messages.pop();
    }

    sendButton.disabled = false;
    statusText.textContent = "AI Assistant";
    promptInput.focus();
}

sendButton.addEventListener("click", sendMessage);

promptInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") sendMessage();
});

document.getElementById("clear").addEventListener("click", function() {
    messages = [];
    chat.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>Welcome to StackNetwork AI</h1>
            <p>Ask anything. Let's get started!</p>
        </div>
    `;
    statusText.textContent = "New chat started";
});

</script>
</body>
</html>
