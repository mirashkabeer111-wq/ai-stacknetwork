
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StackNetwork AI</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
:root {
  --bg:#ffffff;
  --panel:#f7f7f8;
  --text:#171717;
  --muted:#777;
  --border:#e5e5e5;
  --accent:#111111;
}
body.dark {
  --bg:#212121;
  --panel:#171717;
  --text:#f5f5f5;
  --muted:#aaa;
  --border:#373737;
  --accent:#ffffff;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}
button,select,textarea,input { font:inherit; }
button {
  cursor:pointer;
  border:1px solid var(--border);
  border-radius:9px;
  padding:9px 12px;
  color:var(--text);
  background:var(--bg);
}
button:hover { background:var(--panel); }
.app { display:flex; height:100vh; }
.sidebar {
  width:260px;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.brand { font-size:20px;font-weight:bold;padding:8px 4px; }
.new-chat { width:100%;text-align:left; }
.sidebar-bottom { margin-top:auto; }
.main { flex:1;display:flex;flex-direction:column;min-width:0; }
.topbar {
  height:58px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}
.top-actions { display:flex;gap:8px; }
.mobile-menu { display:none; }
.chat {
  flex:1;
  overflow-y:auto;
  padding:25px 16px 35px;
}
.messages {
  max-width:850px;
  margin:auto;
}
.welcome {
  text-align:center;
  margin:90px auto 30px;
}
.welcome h1 { font-size:30px; }
.welcome p { color:var(--muted); }
.message {
  display:flex;
  gap:13px;
  margin:25px 0;
  line-height:1.65;
}
.avatar {
  width:32px;
  height:32px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--panel);
  flex-shrink:0;
  font-size:14px;
}
.content { min-width:0;flex:1;overflow-wrap:anywhere; }
.content pre {
  background:#111;
  color:#eee;
  padding:16px;
  border-radius:10px;
  overflow:auto;
}
.content code { font-family:Consolas,monospace; }
.content :not(pre) > code {
  background:var(--panel);
  padding:3px 5px;
  border-radius:4px;
}
.composer-area {
  padding:12px 16px 18px;
}
.composer {
  max-width:850px;
  margin:auto;
  border:1px solid var(--border);
  border-radius:17px;
  padding:12px;
  background:var(--bg);
  box-shadow:0 2px 12px #0000000a;
}
#prompt {
  width:100%;
  border:0;
  outline:0;
  resize:none;
  min-height:55px;
  max-height:180px;
  background:transparent;
  color:var(--text);
  padding:8px;
}
.composer-footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.composer-footer small { color:var(--muted); }
.send-btn {
  background:var(--accent);
  color:var(--bg);
  border:0;
  padding:10px 18px;
}
.stop-btn { display:none; }
.settings {
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:10;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.settings-card {
  width:100%;
  max-width:450px;
  max-height:90vh;
  overflow:auto;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:15px;
  padding:20px;
}
.settings-card h2 { margin-top:0; }
.field { margin:15px 0; }
.field label {
  display:block;
  margin-bottom:7px;
  font-size:13px;
  color:var(--muted);
}
.field select,.field textarea,.field input {
  width:100%;
  padding:10px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--bg);
  color:var(--text);
}
.field textarea { min-height:100px;resize:vertical; }
.settings-actions {
  display:flex;
  justify-content:flex-end;
  gap:8px;
}
.status {
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:9px;
}
body.large-font .content { font-size:19px; }
body.small-font .content { font-size:14px; }

@media(max-width:700px) {
  .sidebar {
    position:fixed;
    z-index:5;
    left:-270px;
    top:0;
    bottom:0;
    transition:left .2s;
  }
  .sidebar.open { left:0; }
  .mobile-menu { display:inline-block; }
  .topbar { padding:0 10px; }
  .chat { padding:15px 12px; }
  .welcome { margin-top:65px; }
  .welcome h1 { font-size:24px; }
  .composer-area { padding:8px; }
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="brand">⚡ StackNetwork AI</div>
  <button class="new-chat" id="newChat">＋ New Chat</button>
  <div class="sidebar-bottom">
    <button style="width:100%" id="settingsBtn">⚙️ AI Settings</button>
    <button style="width:100%;margin-top:8px" id="instructionsBtn">📝 Custom Instructions</button>
    <p style="font-size:11px;color:var(--muted);text-align:center">
      Developed by Muhammad Ashmil
    </p>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <div>
      <button class="mobile-menu" id="menuBtn">☰</button>
      <strong>StackNetwork AI</strong>
    </div>
    <div class="top-actions">
      <button id="themeBtn">☀️</button>
      <button id="exportBtn">Export</button>
    </div>
  </header>

  <section class="chat" id="chat">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h1>What can I help with?</h1>
        <p>Welcome to StackNetwork AI</p>
      </div>
    </div>
  </section>

  <section class="composer-area">
    <div class="composer">
      <textarea id="prompt" placeholder="Message StackNetwork AI..."></textarea>
      <div class="composer-footer">
        <small>Enter to send · Shift + Enter for new line</small>
        <div>
          <button class="stop-btn" id="stopBtn">Stop</button>
          <button class="send-btn" id="sendBtn">Send ↑</button>
        </div>
      </div>
    </div>
    <div class="status" id="status">
      StackNetwork AI can make mistakes. Check important information.
    </div>
  </section>
</main>
</div>

<!-- Settings -->
<div class="settings" id="settingsModal">
  <div class="settings-card">
    <h2>⚙️ AI Settings</h2>

    <div class="field">
      <label>AI Persona</label>
      <select id="persona">
        <option value="assistant">General Assistant</option>
        <option value="coder">Programmer</option>
        <option value="gaming">Gaming Expert</option>
        <option value="teacher">Teacher</option>
        <option value="creative">Creative</option>
        <option value="professional">Professional</option>
      </select>
    </div>

    <div class="field">
      <label>Response Style</label>
      <select id="style">
        <option value="friendly">Friendly</option>
        <option value="professional">Professional</option>
        <option value="simple">Simple</option>
        <option value="formal">Formal</option>
        <option value="funny">Funny</option>
      </select>
    </div>

    <div class="field">
      <label>Answer Length</label>
      <select id="answerLength">
        <option value="short">Short</option>
        <option value="medium" selected>Medium</option>
        <option value="long">Long</option>
      </select>
    </div>

    <div class="field">
      <label>Response Mode</label>
      <select id="mode">
        <option value="fast">⚡ Fast</option>
        <option value="thinking">🧠 Thinking</option>
      </select>
    </div>

    <div class="field">
      <label>AI Model</label>
      <select id="model"></select>
    </div>

    <div class="field">
      <label>Font Size</label>
      <select id="fontSize">
        <option value="normal">Normal</option>
        <option value="small">Small</option>
        <option value="large">Large</option>
      </select>
    </div>

    <div class="settings-actions">
      <button id="closeSettings">Close</button>
    </div>
  </div>
</div>

<!-- Custom Instructions -->
<div class="settings" id="instructionsModal">
  <div class="settings-card">
    <h2>📝 Custom Instructions</h2>
    <div class="field">
      <label>Tell AI how to respond</label>
      <textarea id="customInstructions"
      placeholder="Example: Explain everything in simple English..."></textarea>
    </div>
    <div class="settings-actions">
      <button id="closeInstructions">Cancel</button>
      <button id="saveInstructions">Save</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

let messages = [];
let controller = null;
let isGenerating = false;
let currentInstructions = "";
let models = [];
let defaultModel = "";

const elements = {
  prompt: $("prompt"),
  messages: $("messages"),
  send: $("sendBtn"),
  stop: $("stopBtn"),
  status: $("status")
};

async function loadConfig() {
  try {
    const response = await fetch("/api/config");
    const config = await response.json();

    models = config.models || [];
    defaultModel = config.defaultModel || "";

    $("model").innerHTML = "";

    models.forEach(model => {
      const option = document.createElement("option");
      option.value = model;
      option.textContent = model;
      $("model").appendChild(option);
    });

    $("model").value = defaultModel;
  } catch (error) {
    elements.status.textContent = "Could not load AI settings.";
  }
}

function renderMarkdown(text) {
  const html = marked.parse(text || "");
  return DOMPurify.sanitize(html);
}

function addMessage(role, text) {
  $("welcome")?.remove();

  const wrapper = document.createElement("div");
  wrapper.className = "message";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "U" : "⚡";

  const content = document.createElement("div");
  content.className = "content";
  content.innerHTML = renderMarkdown(text);

  content.querySelectorAll("pre code").forEach(block => {
    hljs.highlightElement(block);
  });

  wrapper.appendChild(avatar);
  wrapper.appendChild(content);
  elements.messages.appendChild(wrapper);

  $("chat").scrollTop = $("chat").scrollHeight;

  return content;
}

function setGenerating(value) {
  isGenerating = value;
  elements.send.disabled = value;
  elements.stop.style.display = value ? "inline-block" : "none";
  elements.send.textContent = value ? "Working..." : "Send ↑";
}

async function sendMessage() {
  const text = elements.prompt.value.trim();

  if (!text || isGenerating) return;

  elements.prompt.value = "";

  messages.push({ role: "user", content: text });
  addMessage("user", text);

  const assistantContent = addMessage("assistant", "Thinking...");

  controller = new AbortController();
  setGenerating(true);
  elements.status.textContent = "StackNetwork AI is responding...";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        messages,
        instructions: currentInstructions,
        persona: $("persona").value,
        style: $("style").value,
        answerLength: $("answerLength").value,
        mode: $("mode").value,
        model: $("model").value || defaultModel
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed.");
    }

    const reply = data.reply || "No response received.";

    assistantContent.innerHTML = renderMarkdown(reply);

    assistantContent.querySelectorAll("pre code").forEach(block => {
      hljs.highlightElement(block);
    });

    messages.push({ role: "assistant", content: reply });
    elements.status.textContent = "Response complete.";

  } catch (error) {
    if (error.name === "AbortError") {
      assistantContent.textContent = "Generation stopped.";
      elements.status.textContent = "Generation stopped.";
    } else {
      assistantContent.textContent = "Error: " + error.message;
      elements.status.textContent = "Something went wrong.";
    }
  } finally {
    setGenerating(false);
    controller = null;
  }
}

function stopGeneration() {
  if (controller) controller.abort();
}

function newChat() {
  stopGeneration();
  messages = [];
  elements.messages.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>What can I help with?</h1>
      <p>Welcome to StackNetwork AI</p>
    </div>`;
  elements.prompt.value = "";
  elements.status.textContent = "New chat started.";
  $("sidebar").classList.remove("open");
}

function exportChat() {
  if (!messages.length) {
    alert("There is no chat to export.");
    return;
  }

  const content = messages.map(message =>
    `${message.role.toUpperCase()}:\n${message.content}`
  ).join("\n\n");

  const blob = new Blob([content], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "StackNetwork-AI-Chat.txt";
  a.click();

  URL.revokeObjectURL(url);
}

function setTheme() {
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "stacknetwork-theme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
}

function openModal(id) {
  $(id).style.display = "flex";
}

function closeModal(id) {
  $(id).style.display = "none";
}

elements.send.addEventListener("click", sendMessage);
elements.stop.addEventListener("click", stopGeneration);
$("newChat").addEventListener("click", newChat);
$("exportBtn").addEventListener("click", exportChat);
$("themeBtn").addEventListener("click", setTheme);

$("settingsBtn").addEventListener("click", () =>
  openModal("settingsModal")
);
$("closeSettings").addEventListener("click", () =>
  closeModal("settingsModal")
);

$("instructionsBtn").addEventListener("click", () => {
  $("customInstructions").value = currentInstructions;
  openModal("instructionsModal");
});

$("closeInstructions").addEventListener("click", () =>
  closeModal("instructionsModal")
);

$("saveInstructions").addEventListener("click", () => {
  currentInstructions = $("customInstructions").value.trim();
  closeModal("instructionsModal");
  elements.status.textContent = "Custom instructions saved.";
});

$("menuBtn").addEventListener("click", () => {
  $("sidebar").classList.toggle("open");
});

$("fontSize").addEventListener("change", event => {
  document.body.classList.remove("small-font", "large-font");

  if (event.target.value === "small") {
    document.body.classList.add("small-font");
  }

  if (event.target.value === "large") {
    document.body.classList.add("large-font");
  }
});

elements.prompt.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

document.addEventListener("keydown", event => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    newChat();
  }

  if ((event.ctrlKey || event.metaKey) && event.key === "/") {
    event.preventDefault();
    elements.prompt.focus();
  }

  if (event.key === "Escape") {
    stopGeneration();
    closeModal("settingsModal");
    closeModal("instructionsModal");
  }
});

if (localStorage.getItem("stacknetwork-theme") === "dark") {
  document.body.classList.add("dark");
}

loadConfig();
</script>
</body>
</html>
