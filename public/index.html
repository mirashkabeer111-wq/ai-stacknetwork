
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StackNetwork AI</title>
<style>
*{box-sizing:border-box}
:root{--bg:#212121;--side:#171717;--panel:#303030;--text:#fff;--muted:#aaa;--border:#3d3d3d}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;height:100dvh;overflow:hidden}
button,textarea,select{font:inherit}
button{cursor:pointer;color:white}
.app{height:100dvh;display:flex}
.sidebar{width:260px;background:var(--side);padding:18px;display:flex;flex-direction:column;gap:12px;flex-shrink:0;z-index:5}
.brand{font-size:21px;font-weight:bold;padding:8px 4px}
.newchat,.sidebtn{background:transparent;border:1px solid var(--border);padding:12px;border-radius:9px;text-align:left}
.newchat:hover,.sidebtn:hover{background:#303030}
.sidebottom{margin-top:auto;color:var(--muted);font-size:13px;line-height:1.7}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--border)}
.menu{display:none;background:none;border:0;font-size:23px}
.topname{font-weight:bold;font-size:16px}
.options{margin-left:auto;display:flex;gap:7px}
select{background:var(--panel);color:white;border:1px solid var(--border);border-radius:8px;padding:8px;max-width:145px}
.chat{flex:1;overflow-y:auto;padding:25px 18px 150px}
.welcome{max-width:720px;margin:14vh auto 0;text-align:center}
.welcome h1{font-size:34px;margin-bottom:10px}
.welcome p{color:var(--muted)}
.messages{max-width:760px;margin:auto;display:flex;flex-direction:column;gap:22px}
.message{display:flex;gap:12px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.avatar{width:32px;height:32px;flex-shrink:0;border-radius:50%;background:#444;display:grid;place-items:center;font-size:13px}
.content{padding-top:4px;min-width:0}
.message.user .avatar{background:#555}
.composer-wrap{position:absolute;bottom:0;left:0;right:0;padding:15px 18px 20px;background:linear-gradient(transparent,var(--bg) 20%)}
.composer{max-width:760px;margin:auto;background:var(--panel);border:1px solid #555;border-radius:18px;padding:12px;display:flex;align-items:flex-end;gap:10px}
#prompt{flex:1;background:transparent;border:0;outline:0;color:white;resize:none;min-height:28px;max-height:150px;padding:6px}
#send{background:white;color:black;border:0;border-radius:10px;width:38px;height:38px;font-size:19px}
#send:disabled{opacity:.4}
.hint{text-align:center;color:#888;font-size:11px;margin-top:9px}
.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:4}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:10;align-items:center;justify-content:center;padding:18px}
.modalbox{background:#242424;border:1px solid #555;border-radius:15px;padding:20px;width:min(500px,100%)}
.modalbox h2{margin-top:0}
.modalbox textarea{width:100%;height:150px;background:#333;color:white;border:1px solid #555;border-radius:9px;padding:12px;resize:vertical}
.modalbox button{background:white;color:black;border:0;padding:10px 16px;border-radius:8px;margin-top:12px}
@media(max-width:700px){
.sidebar{position:fixed;left:-280px;top:0;bottom:0;width:260px;transition:left .2s}
.sidebar.open{left:0}
.menu{display:block}
.topbar{padding:0 12px}
.options{gap:5px}
select{max-width:112px;padding:7px;font-size:12px}
.chat{padding:18px 13px 145px}
.welcome{margin-top:17vh}
.welcome h1{font-size:27px}
.composer-wrap{padding:12px 10px 15px}
.composer{border-radius:16px}
.message{gap:9px;font-size:15px}
.overlay.show{display:block}
}
@media(max-width:380px){
.topname{font-size:14px}
select{max-width:94px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand">⚡ StackNetwork AI</div>
<button class="newchat" id="newChat">＋ New Chat</button>
<button class="sidebtn" id="instructionsBtn">⚙ Custom Instructions</button>
<div class="sidebottom">
<strong>StackNetwork AI</strong><br>
Developed by Muhammad Ashmil<br>
AI Assistant
</div>
</aside>

<div class="overlay" id="overlay"></div>

<main class="main">
<header class="topbar">
<button class="menu" id="menuBtn">☰</button>
<div class="topname">StackNetwork AI</div>
<div class="options">
<select id="answerLength" aria-label="Answer length">
<option value="short">Short Answer</option>
<option value="long">Long Answer</option>
</select>
<select id="mode" aria-label="Response mode">
<option value="fast">⚡ Fast Mode</option>
<option value="thinking">🧠 Thinking</option>
</select>
</div>
</header>

<section class="chat" id="chat">
<div class="welcome" id="welcome">
<h1>What can I help with?</h1>
<p>Welcome to StackNetwork AI</p>
</div>
<div class="messages" id="messages"></div>
</section>

<div class="composer-wrap">
<div class="composer">
<textarea id="prompt" rows="1" placeholder="Message StackNetwork AI..."></textarea>
<button id="send" title="Send message">↑</button>
</div>
<div class="hint">StackNetwork AI can make mistakes. Check important information.</div>
</div>
</main>
</div>

<div class="modal" id="instructionsModal">
<div class="modalbox">
<h2>Custom Instructions</h2>
<p>Tell StackNetwork AI how you want it to respond.</p>
<textarea id="instructions" placeholder="Example: Answer in simple English..."></textarea>
<br>
<button id="saveInstructions">Save Instructions</button>
<button id="closeInstructions" style="background:#444;color:white;margin-left:7px">Close</button>
</div>
</div>

<script>
const $ = id => document.getElementById(id);

let messages = [];
let customInstructions = "";

function closeSidebar(){
  $("sidebar").classList.remove("open");
  $("overlay").classList.remove("show");
}

$("menuBtn").onclick = () => {
  $("sidebar").classList.toggle("open");
  $("overlay").classList.toggle("show");
};
$("overlay").onclick = closeSidebar;

$("newChat").onclick = () => {
  messages = [];
  $("messages").innerHTML = "";
  $("welcome").style.display = "block";
  $("prompt").value = "";
  closeSidebar();
  $("prompt").focus();
};

$("instructionsBtn").onclick = () => {
  $("instructionsModal").style.display = "flex";
  closeSidebar();
};
$("closeInstructions").onclick = () => {
  $("instructionsModal").style.display = "none";
};
$("saveInstructions").onclick = () => {
  customInstructions = $("instructions").value;
  $("instructionsModal").style.display = "none";
};

function addMessage(role, content){
  $("welcome").style.display = "none";

  const item = document.createElement("div");
  item.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "You" : "AI";

  const text = document.createElement("div");
  text.className = "content";
  text.textContent = content;

  item.append(avatar, text);
  $("messages").appendChild(item);
  $("chat").scrollTop = $("chat").scrollHeight;
  return text;
}

async function sendMessage(){
  const prompt = $("prompt");
  const text = prompt.value.trim();
  if(!text) return;

  prompt.value = "";
  prompt.style.height = "28px";
  addMessage("user", text);
  messages.push({role:"user",content:text});

  const send = $("send");
  send.disabled = true;
  const replyElement = addMessage("assistant","Thinking...");
  
  try{
    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        messages,
        instructions:customInstructions,
        answerLength:$("answerLength").value,
        mode:$("mode").value
      })
    });

    const data = await response.json();

    if(!response.ok) throw new Error(data.error || "Request failed.");

    const reply = data.reply || "No response received.";
    replyElement.textContent = reply;
    messages.push({role:"assistant",content:reply});

  }catch(error){
    replyElement.textContent = "Error: " + error.message;
    messages.pop();
  }finally{
    send.disabled = false;
    $("chat").scrollTop = $("chat").scrollHeight;
    prompt.focus();
  }
}

$("send").onclick = sendMessage;

$("prompt").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

$("prompt").addEventListener("input", e => {
  e.target.style.height = "28px";
  e.target.style.height = Math.min(e.target.scrollHeight,150) + "px";
});
</script>
</body>
</html>
