
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StackNetwork AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #212121;
    color: #fff;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    overflow: hidden;
}

.sidebar {
    width: 250px;
    background: #171717;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.new-chat, .side-button {
    background: transparent;
    color: white;
    border: 1px solid #444;
    border-radius: 9px;
    padding: 12px;
    text-align: left;
    cursor: pointer;
}

.new-chat:hover, .side-button:hover {
    background: #303030;
}

.sidebar-bottom {
    margin-top: auto;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    border-bottom: 1px solid #353535;
}

.topbar button {
    background: #303030;
    color: white;
    border: none;
    padding: 9px 13px;
    border-radius: 8px;
    cursor: pointer;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px 18px;
    display: flex;
    flex-direction: column;
    gap: 22px;
}

.welcome {
    margin: auto;
    text-align: center;
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 12px;
}

.welcome p {
    color: #aaa;
}

.message {
    max-width: 800px;
    width: fit-content;
    padding: 13px 17px;
    border-radius: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    align-self: flex-end;
    background: #303030;
}

.ai {
    align-self: flex-start;
    background: #262626;
}

.controls {
    max-width: 820px;
    width: calc(100% - 30px);
    margin: 0 auto 10px;
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
}

select, .settings-btn {
    background: #303030;
    color: white;
    border: 1px solid #505050;
    border-radius: 8px;
    padding: 9px 12px;
    outline: none;
    cursor: pointer;
}

.input-area {
    max-width: 820px;
    width: calc(100% - 30px);
    margin: 0 auto;
    background: #303030;
    border: 1px solid #505050;
    border-radius: 17px;
    padding: 12px;
}

.input-row {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 15px;
    min-width: 0;
    padding: 8px;
}

#send {
    background: white;
    color: black;
    border: none;
    border-radius: 10px;
    padding: 10px 17px;
    font-weight: bold;
    cursor: pointer;
}

#send:disabled {
    opacity: .5;
}

.hint {
    text-align: center;
    color: #888;
    font-size: 11px;
    padding: 10px;
}

#settings {
    display: none;
    position: fixed;
    inset: 0;
    background: #000a;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.settings-box {
    width: 100%;
    max-width: 450px;
    background: #252525;
    border: 1px solid #555;
    border-radius: 15px;
    padding: 22px;
}

.settings-box h2 {
    margin-bottom: 15px;
}

textarea {
    width: 100%;
    height: 130px;
    resize: vertical;
    background: #171717;
    color: white;
    border: 1px solid #555;
    border-radius: 9px;
    padding: 12px;
    margin: 12px 0;
    font: inherit;
}

.setting-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.setting-actions button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

#saveSettings {
    background: white;
    color: black;
}

#closeSettings {
    background: #444;
    color: white;
}

@media(max-width: 650px) {
    .sidebar {
        width: 65px;
        padding: 12px 7px;
        align-items: center;
    }

    .sidebar .logo {
        font-size: 11px;
        text-align: center;
    }

    .sidebar .new-chat,
    .sidebar .side-button {
        font-size: 0;
        text-align: center;
        width: 48px;
    }

    .sidebar .new-chat::after {
        content: "+";
        font-size: 22px;
    }

    .sidebar .side-button::after {
        content: "⚙";
        font-size: 20px;
    }

    .welcome h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">⚡ StackNetwork AI</div>
    <button class="new-chat" onclick="newChat()">+ New Chat</button>
    <button class="side-button" onclick="openSettings()">Custom Instructions</button>
    <div class="sidebar-bottom">
        <div style="color:#888;font-size:12px">AI Assistant</div>
    </div>
</aside>

<main class="main">

    <header class="topbar">
        <strong>StackNetwork AI</strong>
        <button onclick="newChat()">New Chat</button>
    </header>

    <section id="chat">
        <div class="welcome" id="welcome">
            <h1>What can I help with?</h1>
            <p>Ask anything. Let's get started.</p>
        </div>
    </section>

    <section class="controls">
        <select id="answerLength" aria-label="Answer length">
            <option value="short">Short answers</option>
            <option value="long">Long answers</option>
        </select>

        <select id="mode" aria-label="Response mode">
            <option value="fast">⚡ Fast mode</option>
            <option value="thinking">🧠 Thinking mode</option>
        </select>
    </section>

    <footer>
        <div class="input-area">
            <div class="input-row">
                <input id="prompt"
                    placeholder="Message StackNetwork AI..."
                    autocomplete="off">
                <button id="send" onclick="sendMessage()">↑</button>
            </div>
        </div>
        <p class="hint" id="status">StackNetwork AI can make mistakes. Check important information.</p>
    </footer>

</main>

<div id="settings">
    <div class="settings-box">
        <h2>Custom Instructions</h2>
        <p style="color:#aaa;font-size:13px">
            Tell StackNetwork AI how you want it to respond.
        </p>

        <textarea id="instructions"
            placeholder="Example: Answer in simple English. Be friendly. Explain step by step..."></textarea>

        <div class="setting-actions">
            <button id="closeSettings" onclick="closeSettings()">Cancel</button>
            <button id="saveSettings" onclick="saveSettings()">Save Instructions</button>
        </div>
    </div>
</div>

<script>
const chat = document.getElementById("chat");
const promptInput = document.getElementById("prompt");
const sendButton = document.getElementById("send");
const statusText = document.getElementById("status");

let messages = [];
let customInstructions = "";

function addMessage(text, type) {
    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

async function sendMessage() {
    const text = promptInput.value.trim();

    if (!text || sendButton.disabled) return;

    promptInput.value = "";
    addMessage(text, "user");

    messages.push({
        role: "user",
        content: text
    });

    sendButton.disabled = true;
    statusText.textContent = "StackNetwork AI is thinking...";

    const reply = addMessage("Thinking...", "ai");

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                messages: messages,
                instructions: customInstructions,
                answerLength: document.getElementById("answerLength").value,
                mode: document.getElementById("mode").value
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Something went wrong");
        }

        const answer = data.reply || "No response received.";
        reply.textContent = answer;

        messages.push({
            role: "assistant",
            content: answer
        });

    } catch (error) {
        reply.textContent = "Error: " + error.message;
        messages.pop();
    }

    sendButton.disabled = false;
    statusText.textContent = "AI Assistant";
    promptInput.focus();
}

function newChat() {
    messages = [];

    chat.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>What can I help with?</h1>
            <p>Ask anything. Let's get started.</p>
        </div>
    `;

    statusText.textContent = "New chat started";
}

function openSettings() {
    document.getElementById("settings").style.display = "flex";
    document.getElementById("instructions").value = customInstructions;
}

function closeSettings() {
    document.getElementById("settings").style.display = "none";
}

function saveSettings() {
    customInstructions = document.getElementById("instructions").value.trim();
    closeSettings();
    statusText.textContent = "Custom instructions saved";
}

promptInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") sendMessage();
});
</script>

</body>
</html>
